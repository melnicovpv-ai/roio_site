<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РОЙО — свечи</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2ed;color:#171717}
    .hero{min-height:390px;padding:28px 20px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,#ddd6cc,#f7f4ef);border-radius:0 0 28px 28px}
    .logo{font-size:28px;font-weight:700;letter-spacing:5px}
    .hero h1{font-size:42px;line-height:1;margin:20px 0 10px;max-width:600px}
    .hero p{font-size:17px;max-width:520px;color:#555}
    nav{display:flex;gap:10px;flex-wrap:wrap;padding:18px 20px}
    nav a{color:#171717;text-decoration:none;background:#fff;padding:12px 16px;border-radius:999px;box-shadow:0 2px 12px #0000000b}
    main{max-width:1000px;margin:auto;padding:10px 20px 50px}
    h2{font-size:28px;margin-top:28px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
    .card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 5px 25px #0000000b}
    .card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#e8e3dc}
    .card h3{margin:13px 2px 5px;font-size:20px}
    .card p{margin:0 2px 14px;color:#666}
    button{width:100%;border:0;border-radius:12px;padding:13px;background:#171717;color:#fff;font-size:16px;cursor:pointer}
    .modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .box{background:#fff;border-radius:22px;padding:22px;width:min(480px,100%);position:relative}
    .close{position:absolute;right:14px;top:12px;background:#eee;color:#111;width:auto;padding:7px 11px}
    label{display:block;font-size:14px;margin:12px 0 6px}
    input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
    textarea{min-height:90px;resize:vertical}
    .status{margin-top:12px;font-size:14px}
  </style>
</head>
<body>
  <header class="hero">
    <div class="logo">РОЙО</div>
    <h1>Свечи, созданные для атмосферы.</h1>
    <p>Ароматические свечи ручной работы. Выберите свою — и оформите заказ прямо на сайте.</p>
  </header>

  <nav>
    <a href="https://t.me/sla1vyan" target="_blank">Telegram</a>
    <a href="#" id="channelLink">Канал</a>
  </nav>

  <main>
    <h2>Свечи</h2>
    <div class="products" id="products"></div>
  </main>

  <div class="modal" id="modal">
    <div class="box">
      <button class="close" id="close">×</button>
      <h2 style="margin-top:0">Оформить заказ</h2>
      <form id="orderForm">
        <input type="hidden" id="product">
        <label>Имя</label>
        <input id="name" required placeholder="Как к вам обращаться?">
        <label>Telegram или другой контакт</label>
        <input id="contact" required placeholder="@username">
        <label>Количество</label>
        <input id="quantity" type="number" min="1" value="1" required>
        <label>Комментарий</label>
        <textarea id="comment" placeholder="Дополнительные пожелания"></textarea>
        <button type="submit">Отправить заказ</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

<script>
const products = [
  {name:"Свеча №1", price:"1000 ₽", image:"candle1.jpg"},
  {name:"Свеча №2", price:"1000 ₽", image:"candle2.jpg"},
  {name:"Свеча №3", price:"1000 ₽", image:"candle3.jpg"}
];

const productsEl=document.getElementById("products");
products.forEach(p=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <img src="${p.image}" alt="${p.name}" onerror="this.style.visibility='hidden'">
    <h3>${p.name}</h3>
    <p>${p.price}</p>
    <button onclick="openOrder('${p.name.replaceAll("'","\\'")}')">Заказать</button>`;
  productsEl.appendChild(card);
});

function openOrder(name){
  document.getElementById("product").value=name;
  document.getElementById("modal").classList.add("open");
  document.getElementById("status").textContent="";
}
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("open");

document.getElementById("orderForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const status=document.getElementById("status");
  status.textContent="Отправляем заказ…";
  const data={
    product:document.getElementById("product").value,
    name:document.getElementById("name").value,
    contact:document.getElementById("contact").value,
    quantity:document.getElementById("quantity").value,
    comment:document.getElementById("comment").value
  };
  try{
    const r=await fetch("/api/order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const result=await r.json();
    if(!r.ok) throw new Error(result.error||"Ошибка");
    status.textContent="Заказ отправлен. Спасибо!";
    e.target.reset();
  }catch(err){
    status.textContent="Не удалось отправить заказ: "+err.message;
  }
});
</script>
</body>
</html>
